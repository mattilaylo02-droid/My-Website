<!DOCTYPE html>
<html>
<head>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-image: url("MyIMG.png");
  background-position: center;
  background-repeat:no-repeat;
  background-size: cover;
  background-attachment:fixed;

  
  
}
  
.login-card {
  background-color: white;
  width: 750px;
  height: auto;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  display: flex;
  overflow: hidden;
}

/* Left Blue Section */
.welcome-side {
  width: 45%;
  background-color: #4285f4;
  border-radius: 24px 0 0 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  padding: 20px;
  text-align: center;
  position: relative;
}

.welcome-side h2 {
  font-size: 28px;
  margin-bottom: 12px;
}

.welcome-side p {
  font-size: 14px;
  margin-bottom: 24px;
  opacity: 0.9;
}

.register-btn {
  background-color: white;
  color: #4285f4;
  border: none;
  padding: 10px 28px;
  border-radius: 6px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

/* Right Login Section */
.login-side {
  width: 55%;
  padding: 50px 40px;
  display: flex;
  flex-direction: column;
}

.login-side h1 {
  font-size: 28px;
  color: #222;
  margin-bottom: 30px;
  text-align: center;
}

.input-box {
  position: relative;
  margin-bottom: 16px;
}

.input-box input {
  width: 100%;
  padding: 12px 12px 12px 40px;
  border: none;
  background-color: #f0f2f5;
  border-radius: 6px;
  font-size: 14px;
  outline: none;
}

.input-box .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #888;
  font-size: 18px;
}

.forgot-link {
  text-align: right;
  font-size: 13px;
  color: #4285f4;
  text-decoration: none;
  margin-bottom: 24px;
}

.login-btn {
  background-color: #4285f4;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 6px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 24px;
}

.divider-text {
  text-align: center;
  font-size: 13px;
  color: #888;
  margin-bottom: 16px;
}

.social-icons {
  display: flex;
  justify-content: center;
  gap: 16px;
}

.social-icon {
  width: 36px;
  height: 36px;
  background-color: #f0f2f5;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 18px;
  color: #555;
  text-decoration: none;
}
</style>
</head>
<body>
<div class="login-card">
  <!-- Left Blue Part -->
  <div class="welcome-side">
    <h2>Hello, Welcome!</h2>
    <p>Don't have an account?</p>
    <button class="register-btn">Register</button>
  </div>

  <!-- Right Login Part -->
  <div class="login-side">
    <h1>Login</h1>

    <div class="input-box">
      <span class="icon">👤</span>
      <input type="text" placeholder="Username">
    </div>

    <div class="input-box">
      <span class="icon">🔒</span>
      <input type="password" placeholder="Password">
    </div>

    <a href="#" class="forgot-link">Forgot Password?</a>

    <button class="login-btn">Login</button>

    <p class="divider-text">or login with social platforms</p>

    <div class="social-icons">
      <a href="#" class="social-icon">G</a>
      <a href="#" class="social-icon">f</a>
      <a href="#" class="social-icon">⟳</a>
      <a href="#" class="social-icon">in</a>
    </div>
  </div>
</div>

</body>
</html>
